# Docker-compose deployment for Conductor.
#
#   docker compose up --build              # backend + frontend
#
# Copy .env.example -> .env and fill it in first (see README).

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: conductor-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-specific values that override anything in .env.
      DATABASE_URL: sqlite:////data/conductor.db
      API_HOST: 0.0.0.0            # in-container bind; no host port is published
      # Trusted proxy is nginx (compose subnet); keep in sync with the fixed
      # subnet under `networks:` below.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.29.0.0/16}
      # Fleet discovery: the sibling apps' app.yaml files are mounted at /fleet
      # (see volumes below); the container reaches host-bound app ports via
      # host.docker.internal, so rewrite every manifest's upstream host to it
      # (the port is preserved).
      FLEET_MANIFEST_DIR: /fleet
      FLEET_UPSTREAM_HOST: host.docker.internal
    extra_hosts:
      # Reaches the shared ../llama-swap runtime and the fleet apps on the
      # host — same mechanism PCC and chess use.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data              # SQLite file + WAL sidecars persist here
      # The directory holding the sibling clones' app.yaml manifests. In dev
      # `..` is the workspace root; in deploy the compose runs from
      # ~/deploy/conductor, so `..` is ~/deploy (the clean clones live there).
      # Read-only: conductor only reads manifests, never writes them.
      - "..:/fleet:ro"
    # No `ports:` — the backend is reachable only over the compose network
    # (nginx), never from the host or LAN directly.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - appnet

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Empty → relative /api requests, proxied by nginx to the backend.
        VITE_API_URL: ""
    image: conductor-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Port 8300 sits in conductor's 8300-8399 block; see ../gateway/README.md.
    ports:
      - "127.0.0.1:8300:80"
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
    ipam:
      config:
        # Fixed subnet so TRUSTED_PROXY_IPS has a deterministic value to trust
        # (the frontend/nginx container gets an address in this range). PCC
        # owns 172.28.0.0/16; conductor takes the next block.
        - subnet: 172.29.0.0/16
