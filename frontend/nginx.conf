# Serves the built SPA and reverse-proxies /api to the backend container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend service over the compose network. The trailing
    # setup preserves the /api prefix (backend mounts its router under /api).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A turn can legitimately run minutes: the browser waits 300s
        # (AGENT_RUN_TIMEOUT_MS, src/api/agent.ts) and the backend's own
        # budgets are 300s (the delegate read timeout in fleet/delegate.py,
        # llamacpp_timeout_seconds in config.py). nginx must sit ABOVE every
        # one of those so it never 504s a turn the backend is still working
        # on — the backend or client times out first, never the proxy.
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }

    # Client-side routing: unknown paths fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
