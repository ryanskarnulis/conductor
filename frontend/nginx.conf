# Serves the built SPA and reverse-proxies /api to the backend container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend service over the compose network. The trailing
    # setup preserves the /api prefix (backend mounts its router under /api).
    #
    # The backend is named through a variable so nginx asks Docker's DNS on
    # each request (cached 10s) instead of resolving `backend` once at start.
    # A deploy that recreates only the backend gives it a new address; with a
    # literal proxy_pass nginx kept the old one and every /api call was a 502
    # until this container was restarted (#190, as PCC#523). No URI part on
    # proxy_pass, so the request path and query go through unchanged in both
    # API locations below.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A turn can legitimately run minutes: the browser waits 300s
        # (AGENT_RUN_TIMEOUT_MS, src/api/agent.ts) and the backend's own
        # budgets are 300s (the delegate read timeout in fleet/delegate.py,
        # llamacpp_timeout_seconds in config.py). nginx must sit ABOVE every
        # one of those so it never 504s a turn the backend is still working
        # on — the backend or client times out first, never the proxy.
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }

    # The live channel (#38): a turn's Server-Sent Events. Unbuffered so each
    # event reaches the page as it is sent, HTTP/1.1 so the chunked stream
    # passes through, and a long read timeout: a stream lasts a whole turn
    # and the backend's 15s heartbeats keep it alive well inside this.
    location ~ ^/api/agent/conversations/[0-9]+/events$ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # nginx's mime.types maps .js but not .mjs, so the onnxruntime loader the
    # VAD dynamically imports (/vad/ort-wasm-simd-threaded.mjs) went out as
    # application/octet-stream and the browser refused it as a module script —
    # hands-free died with "no available backend found". A server-level types
    # block would replace the whole inherited map, so set the type per request.
    location ~ \.mjs$ {
        default_type text/javascript;
    }

    # Client-side routing: unknown paths fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
