# Serves the built SPA and reverse-proxies /api to the backend container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend service over the compose network. The trailing
    # setup preserves the /api prefix (backend mounts its router under /api).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Delegate calls to per-app agents may run tens of seconds (later
        # slices); give nginx headroom past the client's own timeout so it
        # doesn't 504 a valid slow call. Mirrors PCC's frontend/nginx.conf.
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
    }

    # Client-side routing: unknown paths fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
