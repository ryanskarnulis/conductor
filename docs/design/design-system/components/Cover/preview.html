<!-- @dsCard height=300 -->
<div class="cv">
<style>
html,body{margin:0;height:100%}
.cv{position:relative;width:960px;height:300px;background:var(--bg);overflow:hidden;font-family:var(--font-sans)}
.cv svg{position:absolute;inset:0}
.glow{fill:var(--glow)} .silk{fill:var(--silk)} .warn{fill:var(--warn)} .ok{fill:var(--ok)} .violet{fill:var(--violet)}
.r{rx:var(--radius)} .rs{rx:var(--radius-step)}
.thread{fill:none;stroke:var(--bg);stroke-width:2}
.spoke{stroke:var(--bg);stroke-width:2}
.cv .name{position:absolute;left:40px;bottom:58px;margin:0;max-width:440px;font-weight:300;font-size:80px;line-height:.95;letter-spacing:-.01em;color:var(--ink)}
.cv .tag{position:absolute;left:42px;bottom:32px;margin:0;max-width:440px;font-size:14px;color:var(--muted)}
</style>
<svg viewBox="0 0 960 300" aria-hidden="true">
<!-- blocks: glow 360×168 (bleeds top/right), silk 108×240, warn 108×120, ok 60×60, violet 168×120; radii radius (12) and radius-step (10)
     arrangement: one wide slab off the top-right corner with four satellites stepping down beneath it
     pattern: a literal motif (the web), concentric silk threads and spokes cut from the ground around a hub in the corner; Conductor is Glitch at the hub of a web
     steps: arcs every 60px (space-8 × 3.33), blocks 12px apart (space-5); radii radius, radius-step -->
<rect class="glow" x="600" y="-12" width="372" height="180"/>
<rect class="silk r" x="480" y="60" width="108" height="252"/>
<rect class="warn rs" x="600" y="180" width="108" height="132"/>
<rect class="ok rs" x="720" y="180" width="60" height="60"/>
<rect class="violet r" x="792" y="180" width="180" height="132"/>
<path class="thread" d="M900 0 A60 60 0 0 0 960 60"/>
<path class="thread" d="M840 0 A120 120 0 0 0 960 120"/>
<path class="thread" d="M780 0 A180 180 0 0 0 960 180"/>
<path class="thread" d="M720 0 A240 240 0 0 0 960 240"/>
<path class="thread" d="M660 0 A300 300 0 0 0 960 300"/>
<line class="spoke" x1="960" y1="0" x2="620" y2="300"/>
<line class="spoke" x1="960" y1="0" x2="480" y2="128"/>
</svg>
<p class="name">Conductor</p>
<p class="tag">Glitch at the hub of the web. Speak, and watch the work happen.</p>
</div>
