[project]
name = "conductor-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "structlog>=25.5.0",
    # func_metadata derives every tool's argument model + JSON Schema from its
    # signature (app/tools/registry.py), and ToolError is re-exported as the
    # domain-error type — the same FastMCP machinery PCC uses. The MCP stdio
    # server itself arrives in a later slice; only the utilities are used here.
    # <2 because mcp 2.0.0 (released 2026-07-28) drops `mcp.server.fastmcp` —
    # registry.py, app/mcp/server.py and the test suite all die at collection
    # on it (CI-only red; local venvs still hold 1.x). chess hit this first
    # and pinned the same way. Migrating to the 2.x shape is its own slice.
    "mcp>=1.20.0,<2",
    # llama.cpp provider speaks the OpenAI wire format over plain httpx
    # (app/ai/providers/llamacpp.py); the per-app delegate client
    # (app/fleet/delegate.py) reuses it.
    "httpx>=0.28.1",
    # Parses the fleet's app.yaml manifests for discovery (app/fleet/manifests.py).
    "pyyaml>=6.0",
    # Conversation persistence and the DB-backed subagent-thread store
    # (app/db/, app/fleet/thread_store.py) — the same stack as PCC.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Voice endpoints take multipart uploads (fastapi UploadFile) —
    # app/api/routes_voice.py.
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "mypy>=2.1.0",
    "ruff==0.15.14",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
